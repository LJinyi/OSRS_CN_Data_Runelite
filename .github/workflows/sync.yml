name: Sync Upstream to GitHub and Gitee

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 从原作者同步代码到你的 GitHub 仓库
      - name: Sync upstream changes to GitHub
        run: |
          gh repo sync LJinyi/OSRS_CN_Data_Runelite -b main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 将你的 GitHub 最新代码同步给 Gitee
      - name: Sync Github repo to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: 'github/LJinyi'
          dst: 'gitee/LJinyi'
          # 修正关键点：将 gitee_token 改为 dst_token
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: '${{ github.event.repository.name }}'
          force_update: true
