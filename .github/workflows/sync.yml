name: Sync upstream to GitHub and Gitee

on:
  # 1. 定时任务：每 6 小时自动跑一次（UTC 时间）
  schedule:
    - cron: '0 */6 * * *'
  # 2. 支持在 GitHub 页面手动点击按钮触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 第一步：把原作者（源仓库）的代码同步到你的 GitHub 仓库
      - name: Sync upstream changes to GitHub
        uses: a27015/sync-upstream-repo@v1.3.0
        with:
          # 源仓库（原作者）的 GitHub 仓库地址
          upstream_repo: 'https://github.com/LJinyi/OSRS_CN_Data_Runelite.git'
          # 上游分支名称（通常是 main 或 master）
          upstream_branch: 'main'
          # 你自己的 GitHub 分支名称
          downstream_branch: 'main'
          # 配合 GitHub 默认 Token 使用即可
          token: ${{ secrets.GITHUB_TOKEN }}

      # 第二步：把你的 GitHub 最新代码同步推送给 Gitee
      - name: Sync Github repo to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: "github/${{ github.repository_owner }}"
          dst: "gitee/${{ github.repository_owner }}"
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          static_list: '${{ github.event.repository.name }}'
          force_update: true
