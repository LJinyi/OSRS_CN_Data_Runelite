name: Sync upstream to GitHub and Gitee

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 第一步：改用维护良好的 repo-sync 组件，将上游原作者代码同步到你的 GitHub
      - name: Sync upstream changes to GitHub
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://github.com/LJinyi/OSRS_CN_Data_Runelite.git"
          source_branch: "main"
          destination_branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 第二步：保持不变，将 GitHub 代码同步到 Gitee
      - name: Sync Github repo to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: "github/${{ github.repository_owner }}"
          dst: "gitee/${{ github.repository_owner }}"
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          static_list: '${{ github.event.repository.name }}'
          force_update: true
