name: Sync Upstream to GitHub and Gitee

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动运行一次
  workflow_dispatch: # 支持手动点击 Run workflow 触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 明确声明代码写入权限
    steps:
      # 1. 使用 GitHub 官方原生能力同步 Aoldbald 的最新代码到你的 GitHub
      - name: Sync upstream changes to GitHub
        run: |
          gh repo sync LJinyi/OSRS_CN_Data_Runelite -b main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 将你的 GitHub 代码强推同步给 Gitee
      - name: Sync Github repo to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: 'github/LJinyi'
          dst: 'gitee/LJinyi'
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          static_list: '${{ github.event.repository.name }}'
          force_update: true
