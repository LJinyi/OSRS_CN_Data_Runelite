name: Sync Fork

on:
  schedule:
    # 定时任务：每天 UTC 0:00（北京时间早 8 点）自动执行
    - cron: '0 0 * * *'
  # 支持手动在 GitHub Actions 界面触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        uses: a2ren/fork-sync@v1
        with:
          # 原仓库地址（改为你需要同步的 upstream 仓库，例如 owner/repo）
          upstream: upstream-owner/upstream-repo
          # 需要同步的分支（如 main 或 master）
          upstream-branch: main
          target-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
